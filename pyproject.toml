[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "victron-gx-publisher"
version = "0.2.0"
description = "Native Venus OS D-Bus solar-yield collector and Neocities publisher."
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
victron-gx-publisher = "victron_gx_publisher.daemon:main"
victron-gx-publish-neocities = "victron_gx_publisher.publisher:main"

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/victron_gx_publisher"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py38"
